<style>

@media(max-width:700px){#hud .t{gap:16px;top:max(12px,env(safe-area-inset-top))}#hud .t b{font-size:20px}#hud .t span{font-size:11px}#msg{font-size:40px}#msg.s{font-size:17px}.scr{padding:18px 12px}}

.pn{background:var(--pan);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:12px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase設定 (空のままだとローカルモードで動作) ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyDIkdTuOg_7ZreS9mgo7-d3EDnTV3gHDsw",authDomain:"skillarena-ed051.firebaseapp.com",projectId:"skillarena-ed051",storageBucket:"skillarena-ed051.firebasestorage.app",messagingSenderId:"365653428674",appId:"1:365653428674:web:427ddf9cbdce5b1a136e5b"};

const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const SK=[
{id:'aim',n:'AIM',d:'ターゲットを撃ち抜く(30秒)',ok:1},
{id:'reaction',n:'REACTION',d:'出現した瞬間に反応(5回)',ok:1},
{id:'tracking',n:'TRACKING',d:'動くターゲットを追い続ける(20秒)',ok:1},
{id:'flick',n:'FLICK',d:'ランダム出現を素早く狙う(25秒)',ok:1},
{id:'movement',n:'MOVEMENT',d:'3Dコースを走ってゴール(WASD+Space)',ok:1},
{id:'dodge',n:'DODGE',d:'飛んでくる弾を避け続ける(WASD)',ok:1},
{id:'memory',n:'MEMORY',d:'光った順番を記憶してクリック',ok:1},
{id:'precision',n:'PRECISION',d:'位置とタイミングを正確に(10回)',ok:1}];
const DEF={sens:+localStorage.getItem('sksens')||1,tsens:1.7,fov:75,invY:0,cs:'dot',csz:6,cg:4,cc:'#ffffff',theme:'#00e5ff',hud:1,tscale:1,tmul:1};
const ST=Object.assign({},DEF);try{Object.assign(ST,JSON.parse(localStorage.getItem('sks')||'{}'))}catch(e){}
const saveST=()=>{try{localStorage.setItem('sks',JSON.stringify(ST))}catch(e){}};
let MODS=[];try{MODS=JSON.parse(localStorage.getItem('skmods')||'[]')}catch(e){}
let MB={};try{MB=JSON.parse(localStorage.getItem('skmb')||'{}')}catch(e){}
const rankOf=s=>s>=900?'S':s>=750?'A':s>=550?'B':s>=350?'C':'D';

/* ===== データ層 (Firestore / localStorage) ===== */
const D={on:!!FIREBASE_CONFIG.apiKey,p:{name:'',best:{},total:0},
async init(){
 if(this.on){try{
  firebase.initializeApp(FIREBASE_CONFIG);this.fs=firebase.firestore();
  this.uid=(await firebase.auth().signInAnonymously()).user.uid;
  const s=await this.fs.doc('users/'+this.uid).get();
  if(s.exists)this.load(s.data());
 }catch(e){console.error(e);this.on=false}}
 if(!this.on){try{this.p=JSON.parse(localStorage.getItem('skarena')||'null')||this.p}catch(e){}}
},
load(d){this.p.name=d.name||'';SK.forEach(k=>{if(d['b_'+k.id]!=null)this.p.best[k.id]=d['b_'+k.id]});this.p.total=d.total||0},
async save(){
 const p=this.p;p.total=SK.reduce((a,k)=>a+(p.best[k.id]||0),0);
 if(this.on){const o={name:p.name,total:p.total,updated:firebase.firestore.FieldValue.serverTimestamp()};
  for(const k in p.best)o['b_'+k]=p.best[k];
  await this.fs.doc('users/'+this.uid).set(o,{merge:true})}
 else try{localStorage.setItem('skarena',JSON.stringify(p))}catch(e){}
},
async submit(id,score,stats){
 const nb=score>(this.p.best[id]??-1);if(nb)this.p.best[id]=score;
 try{if(this.on)await this.fs.collection('scores').add({uid:this.uid,name:this.p.name,skill:id,score,stats,t:firebase.firestore.FieldValue.serverTimestamp()});
  await this.save()}catch(e){console.error(e)}
 return nb},
async rank(id){
 const f=id==='total'?'total':'b_'+id;
 if(!this.on){const v=id==='total'?this.p.total:this.p.best[id];return v?[{name:this.p.name,v,me:1}]:[]}
 const q=await this.fs.collection('users').orderBy(f,'desc').limit(20).get();
 return q.docs.map(d=>({name:d.data().name,v:d.data()[f],me:d.id===this.uid}))}
};

/* ===== 3D シーン ===== */
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x05070f);S.fog=new THREE.Fog(0x05070f,18,70);
const C=new THREE.PerspectiveCamera(75,1,.1,120);C.position.set(0,1.6,0);C.rotation.order='YXZ';
const rs=()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()};addEventListener('resize',rs);rs();
const ENV=new THREE.Group();S.add(ENV);const grid=(c1,c2,fn)=>{const g=new THREE.GridHelper(90,45,c1,c2);fn(g);ENV.add(g)};
grid(0x00e5ff,0x12304a,g=>{});
grid(0x12304a,0x0b1a2c,g=>g.position.y=22);
grid(0xff2d95,0x3a1236,g=>{g.rotation.x=Math.PI/2;g.position.set(0,20,-34)});
[-32,32].forEach(x=>grid(0x4d8dff,0x14264a,g=>{g.rotation.z=Math.PI/2;g.position.set(x,20,0)}));
const deco=[];for(let i=0;i<16;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(.8,2),0),new THREE.MeshBasicMaterial({color:i%2?0xff2d95:0x00e5ff,wireframe:true,transparent:true,opacity:.35}));
 m.position.set(rnd(-28,28),rnd(3,18),-rnd(22,32));ENV.add(m);deco.push(m)}
let yaw=0,pitch=0,sens=ST.sens,locked=false;
const setCam=()=>C.rotation.set(pitch,yaw,0);
const mk=(col,r)=>{r*=ST.tscale;const g=new THREE.Group();
 g.m=new THREE.Mesh(new THREE.SphereGeometry(r,28,18),new THREE.MeshBasicMaterial({color:col}));
 g.h=new THREE.Mesh(new THREE.SphereGeometry(r*1.5,16,12),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.18}));
 g.add(g.m,g.h);g.r=r;S.add(g);return g};
const rm=t=>{S.remove(t)};
const sph=(a,b,d)=>new THREE.Vector3(-d*Math.sin(a)*Math.cos(b),Math.max(.6,1.6+d*Math.sin(b)),-d*Math.cos(a)*Math.cos(b));
const RC=new THREE.Raycaster(),V0=new THREE.Vector2();
const ray=ts=>{C.updateMatrixWorld();RC.setFromCamera(V0,C);const h=RC.intersectObjects(ts.map(t=>t.m));return h.length?ts.find(t=>t.m===h[0].object):null};

/* ===== ゲーム定義 ===== */
const G0={};
G0.aim={dur:30,l:['残り時間','命中','連続'],
 start(){G.hits=G.shots=G.st=G.mx=0;G.tt=[];G.ts=[];for(let i=0;i<3;i++)this.sp(G.t1)},
 sp(now){const t=mk(0x00e5ff,.6);t.position.copy(sph(rnd(-.75,.75),rnd(-.4,.45),rnd(13,24)));t.born=now;G.ts.push(t)},
 tick(now){const left=G.dur-(now-G.t1)/1000;ui(left.toFixed(1),G.hits,G.st);
  G.ts.forEach((t,i)=>t.h.scale.setScalar(1+.08*Math.sin(now/180+i)));if(left<=0)finish()},
 click(now){G.shots++;const t=ray(G.ts);
  if(t){G.ts.splice(G.ts.indexOf(t),1);rm(t);G.hits++;G.st++;G.mx=Math.max(G.mx,G.st);G.tt.push(now-t.born);this.sp(now)}else G.st=0},
 res(){const acc=G.hits/Math.max(G.shots,1),avg=G.tt.length?G.tt.reduce((a,b)=>a+b)/G.tt.length:0;
  return{score:Math.round(Math.min(1000,G.hits*14*(.4+.6*acc)+G.mx*2)),
  stats:[['命中率',(acc*100).toFixed(1)+'%'],['平均撃破時間',Math.round(avg)+' ms'],['最大連続命中',G.mx],['命中数',G.hits+' / '+G.shots]]}}};

G0.reaction={n:5,l:['試行','平均(ms)','ミス'],
 start(){G.k=0;G.rt=[];G.miss=0;G.t=null;G.w=G.t1+rnd(1200,3200);msg('待機…',1)},
 tick(now){if(!G.t&&now>=G.w){G.t=mk(0x7dff9a,1);G.t.position.copy(sph(yaw+rnd(-.35,.35),pitch+rnd(-.2,.2),rnd(10,14)));G.at=now;msg('')}
  if(G.t)G.t.h.scale.setScalar(1+.15*Math.sin(now/60));
  ui((G.k+1>5?5:G.k+1)+' / 5',G.rt.length?Math.round(G.rt.reduce((a,b)=>a+b)/G.rt.length):'-',G.miss)},
 click(now){
  if(!G.t){G.miss++;G.w=now+rnd(1200,3200);msg('フライング!',1);return}
  if(ray([G.t])){G.rt.push(now-G.at);rm(G.t);G.t=null;G.k++;if(G.k>=5)return finish();msg(Math.round(G.rt[G.rt.length-1])+' ms',1);G.w=now+rnd(1200,3200)}
  else G.miss++},
 res(){const a=G.rt.reduce((x,y)=>x+y,0)/G.rt.length,best=Math.min(...G.rt);
  return{score:Math.round(Math.max(0,1000*cl((450-a)/270,0,1)-G.miss*80)),
  stats:[['平均反応時間',Math.round(a)+' ms'],['最速',Math.round(best)+' ms'],['ミス回数',G.miss],['試行',G.rt.length]]}}};

G0.tracking={dur:20,nobtn:1,l:['残り時間','追従率','ズレ(°)'],
 start(){G.on=G.tot=G.err=G.cur=G.mx=0;G.tg=mk(0xff2d95,.8)},
 tick(now,dt){const t=(now-G.t1)/1000,s=1+t*.03,u=t*s;
  G.tg.position.set(Math.sin(u*.7)*9+Math.sin(u*1.9)*3,cl(7+Math.sin(u*.9+1)*4+Math.sin(u*2.3),1,15),-19+Math.sin(u*.5)*4);
  C.updateMatrixWorld();const f=C.getWorldDirection(new THREE.Vector3()),v=G.tg.position.clone().sub(C.position),
  ang=f.angleTo(v),on=ang<Math.atan(G.tg.r/v.length());
  G.tot+=dt;G.err+=ang*dt;if(on){G.on+=dt;G.cur+=dt;G.mx=Math.max(G.mx,G.cur)}else G.cur=0;
  G.tg.m.material.color.set(on?0x7dff9a:0xff2d95);G.tg.h.scale.setScalar(on?1.25:1);
  ui((G.dur-t).toFixed(1),(G.on/G.tot*100).toFixed(0)+'%',(G.err/G.tot*57.3).toFixed(1));if(t>=G.dur)finish()},
 click(){},
 res(){const r=G.on/G.tot,me=G.err/G.tot*57.3;
  return{score:Math.round(1000*(r*.75+Math.max(0,1-me/12)*.25)),
  stats:[['追従率',(r*100).toFixed(1)+'%'],['平均ズレ',me.toFixed(1)+'°'],['最長維持',G.mx.toFixed(2)+' s'],['追従時間',G.on.toFixed(1)+' s']]}}};

const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
G0.flick={dur:25,l:['残り時間','命中','平均(ms)'],

function crossHTML(){const{cs,csz:z,cg:g,cc:c}=ST,sh='0 0 0 1.5px #000',b=(x,y,w,h,e='')=>`<b style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};box-shadow:${sh}${e}"></b>`;
 if(cs==='dot')return`<b style="left:${-z/2}px;top:${-z/2}px;width:${z}px;height:${z}px;border-radius:50%;background:${c};box-shadow:${sh}"></b>`;
 if(cs==='circle')return`<b style="left:${-z}px;top:${-z}px;width:${z*2}px;height:${z*2}px;border-radius:50%;border:2px solid ${c};box-shadow:${sh}"></b>`;
 const L=z*1.6+2;return b(-1,-g-L,2,L)+b(-1,g,2,L)+b(-g-L,-1,L,2)+b(g,-1,L,2)}
function applyST(){C.fov=ST.fov;C.updateProjectionMatrix();sens=ST.sens;document.body.classList.toggle('nohud',!ST.hud);
 document.documentElement.style.setProperty('--c',ST.theme);const h=crossHTML();$('#cross').innerHTML=h;const pc=$('#pc');if(pc)pc.innerHTML=h}
function renderSet(){
 $('#sg').innerHTML='<div class="pn" style="height:100px;position:relative;background:#0a1020"><div class="cx" id="pc"></div></div><div class="pn">'+CTL.map(([k,n,t,a,b,st])=>{const v=ST[k];
  const el=t==='r'?`<input type="range" id="st_${k}" min="${a}" max="${b}" step="${st}" value="${v}"><span id="sv_${k}">${(+v).toFixed(2)}</span>`
   :t==='c'?`<input type="checkbox" id="st_${k}" ${v?'checked':''}><span></span>`
   :t==='o'?`<input type="color" id="st_${k}" value="${v}"><span></span>`
   :`<select id="st_${k}">${a.map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${o[1]}</option>`).join('')}</select><span></span>`;
  return`<div class="sr"><span>${n}</span>${el.replace(/(<input[^>]*>|<select[\s\S]*?<\/select>)/,'<div>$1</div>')}</div>`}).join('')+'</div><p class="em" style="padding:6px">的サイズ・制限時間を変更すると、ランキングには記録されません。</p><button class="btn" id="srs">初期値に戻す</button>';
 $('#srs').onclick=()=>{Object.assign(ST,DEF);saveST();applyST();renderSet()};applyST()}
$('#sg').oninput=e=>{const id=e.target.id;if(!id.startsWith('st_'))return;const k=id.slice(3),c=CTL.find(x=>x[0]===k);
 ST[k]=c[2]==='c'?+e.target.checked:c[2]==='r'?+e.target.value:e.target.value;const sp=$('#sv_'+k);if(sp)sp.textContent=(+ST[k]).toFixed(2);saveST();applyST()};
function renderMods(){
 $('#sm').innerHTML='<div class="pn">'+(MODS.length?MODS.map((m,i)=>`<div class="sr" style="grid-template-columns:1fr auto auto"><span><b>${esc(m.name)}</b> <small style="color:var(--dim)">${esc(m.ver)} ${esc(m.author)}</small> <span class="tag ${m.cos?'on':'off'}">${m.cos?'COSMETIC':'UNRANKED'}</span></span><button class="btn" data-t="${i}">${m.on?'ON':'OFF'}</button><button class="btn" data-d="${i}">削除</button></div>`).join(''):'<div class="em">MODはまだありません</div>')+'</div>'+
 `<div class="pn" style="padding:14px"><div class="row"><button class="btn" id="mf">ファイル(.js)を追加</button><input type="file" id="mfi" accept=".js,text/javascript" class="hide">${SAMPLES.map((x,i)=>`<button class="btn" data-s="${i}">サンプル: ${x.n}</button>`).join('')}</div>
 <textarea id="mc" placeholder="MODのコードを貼り付け(先頭に // @name 名前)"></textarea><div class="row" style="margin-top:8px"><button class="btn p" id="ma">コードを追加</button></div></div>
 <details class="pn" style="padding:14px"><summary>MOD API</summary><pre>// @name 名前 (必須)  // @version  // @author
// @cosmetic true → 見た目だけのMOD。記録の対象になる(それ以外は記録されない)

SA.on('start'|'tick'|'click'|'end'|'menu', fn)
SA.addSkill({id,n,d,dur,l:[ラベル3つ],btn,nobtn,walk,
  start(now), tick(now,dt), click(now), res() → {score, stats:[[名前,値]]}})
SA.mk(色,半径) SA.rm(的) SA.ray([的]) SA.sph(yaw,pitch,距離)
SA.ui(a,b,c) SA.msg(文字) SA.finish()
SA.G 現在のゲーム状態  SA.ST 設定  SA.yaw / SA.pitch
SA.scene SA.camera SA.THREE SA.css(文字列)</pre></details>
 <p class="em" style="padding:6px">⚠ MODはこのページ上で任意のコードを実行します。信頼できるものだけ使ってください。MODが原因で壊れたら URL の末尾に <b>?safe</b> を付けると全MODを無効で起動できます。</p>`}
$('#sm').onclick=e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.t!=null){MODS[+t.dataset.t].on^=1;saveMods();location.reload()}
 else if(t.dataset.d!=null){MODS.splice(+t.dataset.d,1);saveMods();location.reload()}
 else if(t.dataset.s!=null)addMod(SAMPLES[+t.dataset.s].c);
 else if(t.id==='mf')$('#mfi').click();else if(t.id==='ma')addMod($('#mc').value)};
$('#sm').onchange=e=>{if(e.target.id==='mfi'&&e.target.files[0]){const f=new FileReader();f.onload=()=>addMod(f.result);f.readAsText(e.target.files[0])}};
function showSet(t){document.querySelectorAll('#set .tabs .btn').forEach(b=>b.classList.toggle('a',b.dataset.s===t));$('#sg').classList.toggle('hide',t!=='g');$('#sm').classList.toggle('hide',t!=='m');t==='g'?renderSet():renderMods();view('set')}
document.querySelectorAll('#set .tabs .btn').forEach(b=>b.onclick=()=>showSet(b.dataset.s));
$('#opt').onclick=()=>showSet('g');$('#setb').onclick=menu;
applyST();if(!/[?&]safe/.test(location.search))loadMods();
D.init().then(()=>D.p.name?menu():view('login'));
view('login');
</script></body></html>
